<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Angels Knoll drawing set: site plans, sections and elevations of Bunker Hill Parcel Y-1 drawn from LA County lidar contours, building footprints and parcel data, with sourced stakeholder records.">
<style>[hidden]{display:none!important}</style>
<title>Angels Knoll Drawing Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: a drawing-set viewer. Sheet index on the left, the drawing in the middle,
     record drawer on the right, title block bottom-right. Chrome follows the viewer's theme;
     the drawing itself follows the chosen drawing style. */
  :root{
    --paper:#ECEAE0; --paper-2:#E2DFD1; --ink:#1F2421; --ink-soft:#4B5049; --line:#C9C4B4;
    --political:#3457A6; --financial:#B8792F; --cultural:#3F6B4F; --history:#7A6A52; --record:#2F3A45; --flag:#A33B2B;
    --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B1D18; --paper-2:#23261F; --ink:#E9E6DA; --ink-soft:#B8B6A8; --line:#3A3D33;
      --political:#7896D1; --financial:#D9A05B; --cultural:#7CAE8C; --history:#B9A88A; --record:#A9B8C6; --flag:#D68271; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1D18; --paper-2:#23261F; --ink:#E9E6DA; --ink-soft:#B8B6A8; --line:#3A3D33;
    --political:#7896D1; --financial:#D9A05B; --cultural:#7CAE8C; --history:#B9A88A; --record:#A9B8C6; --flag:#D68271; color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden;}
  button{font-family:var(--sans);color:inherit;}
  h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;}
  a{color:var(--political);}
  .mark{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);}

  .app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%;}
  /* sheet index */
  .index{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto;}
  .ihead{padding:16px 16px 12px;border-bottom:1px solid var(--line);}
  .ihead h1{font-size:19px;line-height:1.2;margin-top:4px;}
  .grp{padding:10px 0 4px;border-bottom:1px solid var(--line);}
  .grp>.mark{padding:0 16px 6px;}
  .sheet{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:none;padding:8px 16px;cursor:pointer;color:var(--ink-soft);font-size:13px;}
  .sheet .no{font-family:var(--mono);font-size:11.5px;min-width:44px;}
  .sheet[aria-current="true"]{background:var(--paper-2);color:var(--ink);font-weight:600;}
  .cat{display:flex;align-items:center;gap:9px;padding:5px 16px;font-size:12.5px;cursor:pointer;}
  .cat input{margin:0;accent-color:var(--ink);}
  .cat .sw{width:10px;height:10px;border-radius:50%;}
  .place{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:none;border:none;padding:6px 16px;cursor:pointer;font-size:12.5px;}
  .place:hover,.sheet:hover{background:var(--paper-2);}
  .place .sw{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .place .d{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);}
  :is(.sheet,.place,.seg button,.tog,.drawer button,.zoom button):focus-visible{outline:2px solid var(--political);outline-offset:-2px;}

  .main{position:relative;min-width:0;display:flex;flex-direction:column;}
  .bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);}
  .seg{display:inline-flex;border:1px solid var(--line);}
  .seg button{background:none;border:none;padding:7px 12px;font-size:12.5px;cursor:pointer;}
  .seg button+button{border-left:1px solid var(--line);}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}
  .tog{background:none;border:1px solid var(--line);padding:7px 10px;font-size:12px;cursor:pointer;}
  .tog[aria-pressed="true"]{border-color:var(--ink);background:var(--paper-2);font-weight:600;}
  .bar .lab{font-size:11px;color:var(--ink-soft);letter-spacing:.05em;text-transform:uppercase;}
  .bar .spacer{flex:1;}

  .canvas{position:relative;flex:1;min-height:0;overflow:hidden;}
  svg#dwg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
  svg#dwg:active{cursor:grabbing;}
  .pin{cursor:pointer;}

  /* overlays */
  .tblock{position:absolute;right:12px;bottom:12px;width:300px;max-width:calc(100% - 24px);border:1px solid var(--dl,#111);background:var(--dbg,#fff);color:var(--dl,#111);font-family:var(--mono);font-size:10.5px;pointer-events:auto;}
  .tblock .r{display:flex;border-top:1px solid var(--dl,#111);}
  .tblock .r:nth-child(n+3){display:none;}
  .tblock:hover .r:nth-child(n+3),.tblock:focus-within .r:nth-child(n+3){display:flex;}
  .tblock .r.hint{display:flex;}
  .tblock:hover .r.hint,.tblock:focus-within .r.hint{display:none;}
  .tblock .r:first-child{border-top:none;}
  .tblock .c{padding:6px 8px;flex:1;min-width:0;}
  .tblock .c+.c{border-left:1px solid var(--dl,#111);}
  .tblock .big{font-family:var(--serif);font-size:15px;}
  .tblock .k{opacity:.65;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;display:block;}
  .scale{display:flex;align-items:flex-end;gap:0;height:14px;margin-top:4px;}
  .scale i{display:block;height:6px;border:1px solid var(--dl,#111);border-right:none;}
  .scale i:nth-child(odd){background:var(--dl,#111);}
  .scale i:last-child{border-right:1px solid var(--dl,#111);}
  .north{position:absolute;right:22px;top:16px;width:46px;height:46px;cursor:pointer;}
  .zoom{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;border:1px solid var(--dl,#111);background:var(--dbg,#fff);}
  .zoom button{background:none;border:none;width:32px;height:30px;font-size:16px;cursor:pointer;color:var(--dl,#111);}
  .zoom button+button{border-top:1px solid var(--dl,#111);}
  .legend{position:absolute;left:56px;bottom:12px;max-width:calc(100% - 400px);border:1px solid var(--dl,#111);background:var(--dbg,#fff);color:var(--dl,#111);font-family:var(--mono);font-size:10.5px;padding:6px 9px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;}
  .legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .legend b{display:inline-block;width:12px;height:12px;border-radius:50%;}
  .legend s{display:inline-block;width:18px;height:0;border-top:2px solid currentColor;text-decoration:none;}

  /* record drawer */
  .drawer{position:absolute;top:0;right:0;bottom:0;width:430px;max-width:100%;background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:16px 18px 24px;box-shadow:-8px 0 24px rgba(0,0,0,.12);z-index:5;}
  .drawer .x{float:right;background:none;border:1px solid var(--line);width:30px;height:30px;cursor:pointer;font-size:16px;}
  .drawer h2{font-size:22px;margin:4px 0 4px;}
  .drawer .addr{font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;}
  .drawer .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .catchip{font-size:11px;font-weight:600;padding:2px 8px;border:1px solid var(--c);color:var(--c);}
  .geo{font-family:var(--mono);font-size:11.5px;background:var(--paper-2);border:1px solid var(--line);padding:8px 10px;margin:6px 0 12px;line-height:1.6;}
  .drawer h3{font-size:16px;margin:16px 0 4px;}
  .people{list-style:none;margin:0;padding:0;}
  .people li{border-top:1px solid var(--line);padding:8px 0;font-size:13px;line-height:1.45;}
  .people b{font-weight:600;}
  .facts{list-style:none;margin:0;padding:0;}
  .facts li{border-top:1px solid var(--line);padding:9px 0;}
  .facts p{margin:0 0 6px;font-size:13.5px;line-height:1.5;}
  .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;}
  .meta a::after{content:" ↗";font-size:10px;}
  .chip{display:inline-block;font-size:10.5px;padding:2px 7px;border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap;}
  .chip[data-s="verified"]{color:var(--ink);border-color:var(--ink-soft);}
  .chip[data-s="secondary"],.chip[data-s="located"]{border-style:dotted;border-color:var(--ink-soft);}
  .chip[data-s="estimated"],.chip[data-s="computed"]{color:var(--financial);border-color:var(--financial);}
  .chip[data-s="unresolved"],.chip[data-s="nolink"],.chip[data-s="approx"]{color:var(--flag);border-color:var(--flag);}
  .chip.lg{font-weight:600;background:var(--paper-2);}
  .chip.lg[data-lg="conviction"],.chip.lg[data-lg="judgment"]{color:var(--paper);background:var(--ink);border-color:var(--ink);}
  .chip.lg[data-lg="pending"]{color:var(--flag);border:1px dashed var(--flag);background:none;}
  .note{font-size:12px;color:var(--ink-soft);font-style:italic;line-height:1.5;}
  .egg{border:1px solid var(--financial);padding:10px 12px;margin-top:6px;}

  @media (max-width:860px){
    .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);}
    .index{border-right:none;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;overflow-y:hidden;max-height:none;}
    .ihead,.grp.cats,.grp.places{display:none;}
    .grp{border-bottom:none;display:flex;padding:0;}
    .grp>.mark{display:none;}
    .sheet{white-space:nowrap;padding:10px 12px;}
    .drawer{top:auto;height:62%;width:100%;border-left:none;border-top:1px solid var(--line);}
    .tblock{width:220px;font-size:9.5px;}
    .legend{display:none;}
  }
</style>

</head>

<div class="app">
  <nav class="index" aria-label="Drawing index">
    <div class="ihead"><div class="mark">Parcel Y-1 · 361 S. Hill St</div><h1>Angels Knoll<br>Drawing Set</h1></div>
    <div class="grp" id="sheets"><div class="mark">Sheets</div></div>
    <div class="grp cats"><div class="mark">Records on the drawing</div><div id="cats"></div></div>

  <main class="main">

      <div class="seg" role="group" aria-label="Drawing style">

      <button class="tog" data-layer="labels" aria-pressed="true">Labels</button>
      <span class="lab" id="veLab">Vertical scale</span>
      <div class="seg" role="group" aria-label="Vertical exaggeration" id="veSeg">
        <button data-ve="1" aria-pressed="true">1× true</button><button data-ve="2" aria-pressed="false">2×</button>
      </div>
      <span class="spacer"></span>
    </div>
    <div class="canvas" id="canvas">
      <svg id="dwg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architectural drawing"></svg>
      <svg class="north" id="north" viewBox="-25 -25 50 50" aria-label="North arrow"></svg>
      <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit drawing">⤢</button></div>
      <div class="legend" id="legend"></div>
      <div class="tblock" id="tblock"></div>
      <aside class="drawer" id="drawer" hidden aria-live="polite"></aside>
    </div>
  </main>
</div>

    s += T(D.track/2, (Y(zt)+Y(zb))/2 - 14*px, `ANGELS FLIGHT · ${fmt(D.track)}′ IN PLAN BETWEEN TRACK ENDS (OSM) · ${fmt(zt-zb,1)}′ GROUND FALL`, {size:9.5, anchor:"middle", rot:-Math.atan2(Y(zt)-Y(zb), D.track)/deg*-1, fill:st.ink, halo:st.bg, weight:600});
    const pos = state.carsSwapped ? [.72,.28] : [.28,.72];
    pos.forEach((k,i)=>{ const x = D.track*k, z = zt + (zb-zt)*k; s += `<g class="pin" data-egg="cars"><rect x="${x-9}" y="${Y(z)-12*ve}" width="18" height="${11*ve}" fill="#E0692B" stroke="${st.ink}" stroke-width="${(.8*px).toFixed(2)}" transform="rotate(${Math.atan2(Y(zb)-Y(zt), D.track)/deg} ${x} ${Y(z)})"/></g>` + (state.layers.labels ? T(x, Y(z)-18*ve - 6*px, i===0?"SINAI":"OLIVET", {size:8.5, anchor:"middle", fill:st.soft, halo:st.bg}) : ""); });
  }
  // context: tallest neighbours named with measured heights
  if(state.layers.labels){
    const named = [["twocal","TWO CALIFORNIA PLAZA"],["onecal","ONE CALIFORNIA PLAZA"],["usbank","U.S. BANK TOWER"],["gcm","GRAND CENTRAL MARKET"],["crala","PERSHING SQ. BLDG"],["bradbury","BRADBURY"]];
    named.forEach(([k,n])=>{ const p = PL(k); if(!p) return; const b = bldAt(p) || (nearBld(p)?.d < 60 ? nearBld(p).b : null); if(!b) return; const o = beyond.find(x=>x.b===b); if(!o) return;
      const x = (o.t0+o.t1)/2, top = b.base + b.h; s += T(x, Y(Math.min(top, 470)) - 6*px, `${n} · ${fmt(b.h)}′`, {size:9.5, anchor:"middle", fill:st.ink, halo:st.bg, weight:600}); });
  }
  // title strip
  s += T(D.tmin, Y(datum) + 46*px, D.label, {size:11, fill:st.ink, weight:600});
  s += T(D.tmin, Y(datum) + 60*px, `GROUND FROM LA COUNTY LARIAC 2-FT CONTOURS · BUILDINGS: LARIAC FOOTPRINTS & MEASURED HEIGHTS · VERTICAL SCALE ${ve===1?"TRUE (1:1)":"EXAGGERATED 2×"}`, {size:9, fill:st.soft});
  return s;
}
function levelMark(x, z, st, Y, strong){ const y = Y(z); return `<path d="M${x-5*px} ${y-8*px}L${x+5*px} ${y-8*px}L${x} ${y}Z" fill="${strong?st.accent:st.bg}" stroke="${strong?st.accent:st.ink}" stroke-width="${(.8*px).toFixed(2)}"/>` + T(x + 7*px, y - 9*px, `+${fmt(z,1)}′`, {size:9.5, fill:st.ink, halo:st.bg, weight:strong?700:500}); }

/* ---- record pins ---- */
function drawPins(st){
  if(!state.layers.pins) return "";
  let s = ""; const vb = state.vb, isPlan = SHEETS.find(x=>x.id===state.sheet).kind === "plan";
  if(!isPlan) return "";
  PLACES.forEach((pl,i)=>{
    if(!pl.at || !pl.cats.some(c=>state.cats.has(c))) return;
    if(state.sheet==="parcel" && !["site","gates","metro","flight","carve","twocal"].includes(pl.id)) return;
    let q = plan(pl.at); const cat = pl.cats.find(c=>state.cats.has(c)); const col = st.pin(cat);
    const inside = q[0] > vb[0] && q[0] < vb[0]+vb[2] && q[1] > vb[1] && q[1] < vb[1]+vb[3];
    if(!inside){ // off-sheet: arrow at the frame edge with the true distance
      const cx = vb[0]+vb[2]/2, cy = vb[1]+vb[3]/2, dx = q[0]-cx, dy = q[1]-cy, k = Math.min((vb[2]/2-30*px)/Math.abs(dx||1e-9), (vb[3]/2-30*px)/Math.abs(dy||1e-9));
      const ex = cx + dx*k, ey = cy + dy*k, dist = Math.hypot(pl.at[0]-siteC[0], pl.at[1]-siteC[1]), ang = Math.atan2(dy,dx)/deg;
      s += `<g class="pin" data-id="${pl.id}" tabindex="0" role="button" aria-label="${esc(pl.name)}, off the sheet"><g transform="translate(${ex} ${ey}) rotate(${ang})"><path d="M${-10*px} ${-7*px}L${8*px} 0L${-10*px} ${7*px}Z" fill="${col}"/></g>`;
      s += T(ex - Math.cos(ang*deg)*16*px, ey - Math.sin(ang*deg)*16*px + 3*px, `${pl.name} · ${dist > 2640 ? fmt(dist/5280,2)+" mi" : fmt(dist)+" ft"}`, {size:9.5, anchor: dx > 0 ? "end" : "start", fill:st.ink, halo:st.bg, weight:600}) + `</g>`;
      return;
    }
    const r = (pl.kind==="small"?7:10)*px, sel = state.sel === pl.id;
    s += `<g class="pin" data-id="${pl.id}" tabindex="0" role="button" aria-label="${esc(pl.name)}">
      <circle cx="${q[0]}" cy="${q[1]}" r="${r + (sel?4*px:0)}" fill="${col}" stroke="${st.bg}" stroke-width="${(2*px).toFixed(2)}" ${state.style==="night"?`filter="url(#glow)"`:""}/>
      ${T(q[0], q[1] + 3.6*px, String(i+1), {size:9.5, anchor:"middle", fill:st.pinText, weight:700})}
      ${state.layers.labels && pl.kind!=="small" && !(state.sheet==="ctx" && ["twocal","onecal","moca","crala"].includes(pl.id)) ? T(q[0] + r + 4*px, q[1] - r, pl.name, {size:9.5, fill:st.ink, halo:st.bg, weight:600, font:"IBM Plex Sans, sans-serif"}) : ""}</g>`;
  });
  return s;
}

/* ---- render ---- */
function render(){
  const st = STY[state.style], sh = SHEETS.find(x=>x.id===state.sheet);
  const r = svg.getBoundingClientRect(); px = state.vb[2]/Math.max(1, r.width);
  svg.setAttribute("viewBox", state.vb.join(" ")); svg.style.background = st.bg;
  let body = defs(st);
  if(sh.kind==="plan"){ body += drawPlan(st, sh.id==="parcel") + (sh.id==="parcel" ? parcelDetails(st) : "") + planLabels(st, sh.id==="parcel"); if(state.style==="night") body = body; }
  else body += drawSection(st);
  body += drawPins(st);
  if(sh.id==="ctx" && state.layers.labels){ const c = plan(siteC); body += T(state.vb[0]+16*px, state.vb[1]+22*px, "A1.01 · SITE PLAN · CONTEXT", {size:11, fill:st.ink, weight:600}); }
  svg.innerHTML = body;
  document.getElementById("canvas").style.setProperty("--dbg", st.bg); document.getElementById("canvas").style.setProperty("--dl", st.ink);
  drawNorth(st, sh); drawTB(st, sh); drawLegend(st, sh);
}
function drawNorth(st, sh){
  const n = document.getElementById("north"); n.style.display = sh.kind==="plan" ? "block" : "none";
  // true north sits 37.8° counter-clockwise from the drawing's up (the street grid)
  n.innerHTML = `<g transform="rotate(-37.8)"><circle r="20" fill="${st.bg}" stroke="${st.ink}" stroke-width="1.2"/><path d="M0 -17L6 8L0 3L-6 8Z" fill="${st.ink}"/><text y="-21" text-anchor="middle" font-size="8" font-family="IBM Plex Mono" fill="${st.ink}" transform="rotate(37.8 0 -24)">N</text></g>`;
}
function drawTB(st, sh){
  const r = svg.getBoundingClientRect(), ftPerPx = state.vb[2]/Math.max(1,r.width);
  const nice = [10,20,25,50,100,200,250,500,1000]; let unit = nice.find(u=>u/ftPerPx >= 34) || 1000; const seg = unit/ftPerPx;
  const isPlan = sh.kind==="plan";
  document.getElementById("tblock").innerHTML = `
    <div class="r"><div class="c"><span class="k">Sheet</span><span class="big">${sh.no}</span></div><div class="c" style="flex:3"><span class="k">${esc(sh.group)}</span>${esc(sh.name)}</div></div>
    <div class="r"><div class="c"><span class="k">Scale</span><div class="scale">${("<i style='width:"+seg.toFixed(0)+"px'></i>").repeat(4)}</div><span>0 · ${unit} · ${unit*2} · ${unit*4} ft</span></div>
      <div class="c"><span class="k">${isPlan?"Orientation":"Vertical"}</span>${isPlan?"Grid up · true north 37.8° CCW":(state.ve===1?"True scale, 1:1":"2× exaggerated")}</div></div>
    <div class="r"><div class="c"><span class="k">Data</span>LARIAC buildings & 2-ft contours · LA County Assessor parcels · © OpenStreetMap contributors</div></div>
    <div class="r"><div class="c"><span class="k">Project</span>Angels Knoll · Parcel Y-1 · 361 S. Hill St</div><div class="c" style="flex:.7"><span class="k">Date</span>Oct 2026 <button aria-label="A goose" data-egg="goose" style="background:none;border:none;padding:0;cursor:pointer;color:inherit;font-size:12px">𓅬</button></div></div>
    <div class="r hint"><div class="c" style="opacity:.75">Hover for data sources · ${state.eggs.size}/3 easter eggs found</div></div>`;
  document.querySelector('[data-egg="goose"]').onclick = ()=>egg("goose");
}
function drawLegend(st, sh){
  const L = document.getElementById("legend"); let h = "";
  if(state.style==="diagram"){
    if(sh.kind==="plan") h += `<span>Building height:</span><span><b style="background:${heightRamp(20)}"></b>low</span><span><b style="background:${heightRamp(150)}"></b>~150′</span><span><b style="background:${heightRamp(800)}"></b>800′+</span><span><s style="color:#3C825A"></s>276′</span><span><s style="color:#B8792F"></s>388′ contours</span>`;
    else h += `<span>Grade:</span><span><b style="background:#9CC5A1"></b>&lt;5%</span><span><b style="background:#E8D27A"></b>5–15%</span><span><b style="background:#E39A55"></b>15–30%</span><span><b style="background:#C2493A"></b>&gt;30%</span>`;
    h += `<span>· Records:</span>` + Object.entries(CATS).map(([k,v])=>`<span><b style="background:${st.pin(k)}"></b>${v}</span>`).join("");
  } else if(sh.kind==="plan") h += `<span><s style="border-top-style:dashed"></s>property line</span><span><s></s>Angels Flight</span><span><s style="border-top-style:dotted"></s>Metro tunnel (below)</span><span>contours every 2′, bold every 10′</span>`;
  else h += `<span>cut ground shown in ${state.style==="tech"?"hatch":"solid"}</span><span>buildings beyond in outline</span><span>levels in feet</span>`;
  L.innerHTML = h;
}

/* ======================= INTERACTION ======================= */
function setSheet(id){ state.sheet = id; state.sel = null; document.getElementById("drawer").hidden = true;
  try{ history.replaceState(null,"","#"+id); }catch(e){}
  document.querySelectorAll(".sheet").forEach(b=>b.setAttribute("aria-current", String(b.dataset.id===id)));
  const isSec = SHEETS.find(s=>s.id===id).kind !== "plan"; document.getElementById("veSeg").style.display = isSec ? "" : "none"; document.getElementById("veLab").style.display = isSec ? "" : "none";
  fit(); }
function buildIndex(){
  let g = ""; ["Plans","Sections","Elevations"].forEach(grp=>{ g += `<div class="mark" style="padding:8px 16px 2px">${grp}</div>` + SHEETS.filter(s=>s.group===grp).map(s=>`<button class="sheet" data-id="${s.id}"><span class="no">${s.no}</span>${esc(s.name)}</button>`).join(""); });
  document.getElementById("sheets").innerHTML = `<div class="mark">Sheets</div>` + g;
  document.querySelectorAll(".sheet").forEach(b=>b.onclick = ()=>setSheet(b.dataset.id));
  document.getElementById("cats").innerHTML = Object.entries(CATS).map(([k,v])=>`<label class="cat"><input type="checkbox" data-cat="${k}" checked><span class="sw" style="background:var(--${k})"></span>${v}</label>`).join("");
  document.querySelectorAll("[data-cat]").forEach(c=>c.onchange = ()=>{ c.checked ? state.cats.add(c.dataset.cat) : state.cats.delete(c.dataset.cat); render(); });
  document.getElementById("places").innerHTML = PLACES.map((p,i)=>{ const d = Math.hypot(p.at[0]-siteC[0], p.at[1]-siteC[1]); return `<button class="place" data-id="${p.id}"><span class="sw" style="background:var(--${p.cats[0]})"></span>${i+1}. ${esc(p.name)}<span class="d">${p.id==="site"?"site":d>2640?fmt(d/5280,1)+" mi":fmt(d)+"′"}</span></button>`; }).join("");
  document.querySelectorAll(".place").forEach(b=>b.onclick = ()=>openPlace(b.dataset.id, true));
}
const lgChip = lg => { if(!lg) return ""; const k = lg.split(/[ ·(]/)[0].toLowerCase(); return `<span class="chip lg" data-lg="${k}">${esc(lg)}</span>`; };
const srcLinks = keys => keys.map(k=>`<a href="${U[k][1]}" target="_blank" rel="noopener">${esc(U[k][0])}</a>`).join("");
function openPlace(id, pan){
  const pl = PLACES.find(p=>p.id===id); state.sel = id;
  const b = bldAt(pl.at) || (nearBld(pl.at)?.d < 60 ? nearBld(pl.at).b : null), z = zAt(pl.at[0], pl.at[1]), dist = Math.hypot(pl.at[0]-siteC[0], pl.at[1]-siteC[1]);
  const geo = [`Distance from site centre: ${dist > 2640 ? fmt(dist/5280,2)+" mi" : fmt(dist)+" ft"}`];
  if(z) geo.push(`Ground elevation here: ${fmt(z,1)} ft (from 2-ft contours)`);
  if(b) geo.push(`Building: ${fmt(b.h,1)} ft tall, base at ${fmt(b.base,1)} ft (LARIAC)`);
  if(id==="site"){ geo.push(`Area: ${fmt(SITEP.area)} sq ft (County parcel) · CF 14-0425 lists 104,947 sq ft (2014, before the 2017 carve-out)`); Object.entries(corners).forEach(([k,o])=>geo.push(`${k}: ${fmt(o.z,1)} ft`)); geo.push(`High-to-low fall across the parcel: ${fmt(corners["Olive × Angels Flight"].z - corners["Hill × 4th"].z,1)} ft`); }
  const d = document.getElementById("drawer");
  d.innerHTML = `<button class="x" id="dx" aria-label="Close">×</button><div class="mark">Place ${PLACES.indexOf(pl)+1}${pl.off?" · off this sheet":""}${pl.approx?" · location approximate":""}</div>
    <h2>${esc(pl.name)}</h2><div class="addr">${esc(pl.addr)}</div>
    <div class="chips">${pl.cats.map(c=>`<span class="catchip" style="--c:var(--${c})">${CATS[c]}</span>`).join("")}</div>
    <div class="geo">${geo.map(esc).join("<br>")}<div class="meta" style="margin-top:6px"><span class="chip" data-s="computed">Computed from GIS data</span>${srcLinks(["lariac","parcels","osm"])}</div></div>
    ${pl.extra ? `<p class="note">${esc(pl.extra)}</p>` : ""}
    ${pl.people.length ? `<h3>Stakeholders here</h3><ul class="people">${pl.people.map(([n,r,s,src])=>`<li><b>${esc(n)}</b> · ${esc(r)}<div class="meta" style="margin-top:4px"><span class="chip" data-s="${s}">${STATUS[s]}</span>${srcLinks(src)}</div></li>`).join("")}</ul>` : ""}
    ${pl.recs.map(k=>{ const r = REC[k]; return `<h3>${esc(r.t)}</h3><ul class="facts">${r.facts.map(f=>`<li><p>${esc(f.t)}</p><div class="meta">${lgChip(f.lg)}<span class="chip" data-s="${f.s}">${STATUS[f.s]}</span>${srcLinks(f.src)}</div></li>`).join("")}</ul>`; }).join("")}`;
  d.hidden = false; document.getElementById("dx").onclick = ()=>{ d.hidden = true; state.sel = null; render(); };
  if(pan){ const sh = SHEETS.find(s=>s.id===state.sheet); if(sh.kind!=="plan" || (pl.off && state.sheet!=="ctx")) setSheet("ctx"); const q = plan(pl.at); if(!pl.off){ state.vb[0] = q[0] - state.vb[2]*.4; state.vb[1] = q[1] - state.vb[3]/2; } state.sel = id; }
  render();
}
function egg(id){
  state.eggs.add(id);
  const d = document.getElementById("drawer");
  const msg = {
    bench:`<h2>The bench</h2><p class="note">In <em>(500) Days of Summer</em> (2009), a bench in the Angels Knoll park looked out over downtown. Its exact position isn't surveyed here, so this glyph is approximate. The dotted line shows the view east over Hill Street.</p>`,
    cars:`<h2>Sinai and Olivet</h2><p class="note">Angels Flight runs two counterbalanced cars named Sinai and Olivet: as one climbs, the other descends. You just swapped them.</p>`,
    goose:`<h2>A stray goose</h2><p class="note">It wandered over from Goose Lake. Geese are good at reading contours: they always know which way is downhill.</p>`
  }[id];
  d.innerHTML = `<button class="x" id="dx" aria-label="Close">×</button><div class="mark">Easter egg ${state.eggs.size} of 3</div><div class="egg">${msg}</div>`;
  d.hidden = false; document.getElementById("dx").onclick = ()=>{ d.hidden = true; };
  if(id==="bench") state.sight = !state.sight;
  if(id==="cars") state.carsSwapped = !state.carsSwapped;
  render();
}

// pan / zoom
(function(){
  let drag = null; const pts = new Map(); let pinch = null;
  svg.addEventListener("pointerdown", e=>{ svg.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); drag = {x:e.clientX, y:e.clientY, vb:[...state.vb], moved:0, target:e.target};
    if(pts.size===2){ const [a,b] = [...pts.values()]; pinch = {d:Math.hypot(a.x-b.x,a.y-b.y), vb:[...state.vb]}; } });
  svg.addEventListener("pointermove", e=>{ if(!drag) return; const p = pts.get(e.pointerId); if(p){ p.x = e.clientX; p.y = e.clientY; }
    const r = svg.getBoundingClientRect(), k = state.vb[2]/r.width;
    if(pts.size===2 && pinch){ const [a,b] = [...pts.values()], d = Math.hypot(a.x-b.x,a.y-b.y); zoomAt(r.width/2, r.height/2, pinch.d/d, pinch.vb); drag.moved = 99; return; }
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved = Math.max(drag.moved, Math.abs(dx)+Math.abs(dy));
    if(drag.moved > 4){ state.vb[0] = drag.vb[0] - dx*k; state.vb[1] = drag.vb[1] - dy*k; scheduleRender(); } });
  const end = e=>{ pts.delete(e.pointerId); if(!drag) return; if(drag.moved <= 4){ const g = drag.target.closest && drag.target.closest(".pin"); if(g){ if(g.dataset.egg) egg(g.dataset.egg); else if(g.dataset.id) openPlace(g.dataset.id, false); } } if(pts.size===0){ drag = null; pinch = null; } };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  svg.addEventListener("wheel", e=>{ e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(e.deltaY*.0012)); }, {passive:false});
  svg.addEventListener("keydown", e=>{ const g = e.target.closest && e.target.closest(".pin"); if(g && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); g.dataset.egg ? egg(g.dataset.egg) : openPlace(g.dataset.id, false); } });
})();
function zoomAt(sx, sy, f, base){ const r = svg.getBoundingClientRect(), vb = base ? [...base] : state.vb;
  const fx = vb[0] + sx/r.width*vb[2], fy = vb[1] + sy/r.height*vb[3]; const w = Math.max(60, Math.min(6000, vb[2]*f)), h = w*vb[3]/vb[2];
  state.vb = [fx - (fx-vb[0])*w/vb[2], fy - (fy-vb[1])*h/vb[3], w, h]; scheduleRender(); }
let rq = 0; function scheduleRender(){ if(rq) return; rq = requestAnimationFrame(()=>{ rq = 0; render(); }); }
document.getElementById("zin").onclick = ()=>{ const r = svg.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, .7); };
document.getElementById("zout").onclick = ()=>{ const r = svg.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1/.7); };
document.getElementById("zfit").onclick = fit;
document.getElementById("north").onclick = ()=>{ const n = document.getElementById("north"); n.animate([{transform:"rotate(0)"},{transform:"rotate(360deg)"}], {duration:700}); };
document.querySelectorAll("[data-style]").forEach(b=>b.onclick = ()=>{ state.style = b.dataset.style; document.querySelectorAll("[data-style]").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); render(); });
document.querySelectorAll("[data-layer]").forEach(b=>b.onclick = ()=>{ const k = b.dataset.layer; state.layers[k] = !state.layers[k]; b.setAttribute("aria-pressed", String(state.layers[k])); render(); });
document.querySelectorAll("[data-ve]").forEach(b=>b.onclick = ()=>{ state.ve = +b.dataset.ve; document.querySelectorAll("[data-ve]").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); fit(); });
addEventListener("resize", ()=>fit());
addEventListener("keydown", e=>{ if(e.key==="Escape"){ document.getElementById("drawer").hidden = true; state.sel = null; render(); } });

buildIndex(); setSheet(state.sheet);
</script>

</body>
